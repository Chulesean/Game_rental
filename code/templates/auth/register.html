{% extends "base.html" %}
{% block title %}Sign Up — PlayerHire{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap {
    max-width: 420px;
    margin: 3rem auto;
  }
  .auth-wrap h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.9rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.4rem;
  }
  .auth-wrap .sub { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
  }
  .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.88rem; color: var(--muted); }
  .auth-footer a { color: var(--accent); text-decoration: none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <h1>Create account</h1>
  <p class="sub">Join PlayerHire and start gaming.</p>

  <div class="auth-card">
    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="coolplayer42" required />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Choose a strong password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem;">
        Create Account
      </button>
    </form>
  </div>

  <p class="auth-footer">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
  </p>
</div>
{% endblock %}
