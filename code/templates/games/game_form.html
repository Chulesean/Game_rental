{% extends "base.html" %}
{% block title %}{{ 'Add New Game' if not game else 'Edit Game' }} — PlayerHire{% endblock %}

{% block content %}
<div style="max-width:500px;margin:0 auto;">
  <a href="{{ url_for('games.listing') }}" style="color:var(--muted);font-size:0.88rem;text-decoration:none;display:inline-block;margin-bottom:1.5rem;">← Back to games</a>

  <div class="page-header">
    <h1>{{ 'Add a New Game' if not game else 'Edit Game' }}</h1>
    <p>Help expand our catalogue.</p>
  </div>

  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label for="title">Game Title *</label>
        <input type="text" id="title" name="title" value="{{ game.title if game else '' }}" placeholder="e.g., Valorant, League of Legends" required />
      </div>

      <div class="form-group">
        <label for="genre">Genre</label>
        <input type="text" id="genre" name="genre" value="{{ game.genre if game else '' }}" placeholder="FPS, RPG, MOBA, etc." />
      </div>

      <div class="form-group">
        <label for="platform">Platform</label>
        <input type="text" id="platform" name="platform" value="{{ game.platform if game else '' }}" placeholder="PC, PS5, Xbox, Switch" />
      </div>

      <button type="submit" class="btn btn-primary">Save Game</button>
    </form>
  </div>
</div>
{% endblock %}
