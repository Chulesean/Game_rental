version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: gamecompanion
      POSTGRES_PASSWORD: gamecompanion123
      POSTGRES_DB: gamecompanion_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamecompanion"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://gamecompanion:gamecompanion123@db:5432/gamecompanion_db
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./code:/app/code

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
  